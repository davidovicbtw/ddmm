# ddmm keybinds - classic hyprland.conf syntax.
# Add to hyprland.conf:  source = ~/.config/ddmm/hypr/ddmm.conf
exec-once = ~/.local/bin/ddmm run --replace

bind = SUPER, Space, exec, ~/.local/bin/ddmm launcher
bind = SUPER, S,     exec, ~/.local/bin/ddmm island toggle
bind = SUPER, G,     exec, ~/.local/bin/ddmm wallpaper
bind = SUPER, K,     exec, ~/.local/bin/ddmm power
bind = SUPER, L,     exec, ~/.local/bin/ddmm lock
bind = SUPER, V,     exec, ~/.local/bin/ddmm launcher 'v '

# brightness (shows the bar inside the island)
bindel = , XF86MonBrightnessUp,   exec, brightnessctl -q set 5%+; ~/.local/bin/ddmm osd bright
bindel = , XF86MonBrightnessDown, exec, brightnessctl -q set 5%-; ~/.local/bin/ddmm osd bright

# lock when the lid closes
bindl = , switch:on:Lid Switch, exec, ~/.local/bin/ddmm lock
